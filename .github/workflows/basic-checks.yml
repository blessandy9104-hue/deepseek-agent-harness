name: Basic checks

# Lightweight GitHub-hosted validation for this repository. The upstream
# DeepSeek Harness workflows expect the deepseek-ai organization's custom
# enterprise runners and secrets; this workflow runs the keyless, standard-runner
# checks so every contribution to this repository sees green signals.
#
# See .github/AGENTS.md for the repository's full CI topology.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-lint:
    name: Documentation and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bilingual pairing and quick documentation checks
        run: pnpm run test:docs

      - name: Whitespace check
        run: git diff --check

      - name: Lint
        run: pnpm run lint